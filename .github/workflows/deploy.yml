name: CI & Deploy Kovanica Node

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Build, Test, Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests (unit + integration + doctests)
        run: cargo test

      - name: Build release binary
        run: cargo build --release --workspace

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: kovanica-node
          path: target/release/kovanica-node
          retention-days: 7

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: test
    # Arm by adding the VPS_* secrets AND setting the DEPLOY_ENABLED repo
    # variable to "true" (Settings -> Secrets and variables -> Actions ->
    # Variables). Until then this job is skipped instead of failing.
    #
    # Deploy is non-blocking: the Build/Test job above is the real CI gate.
    # A deploy failure here (e.g. the VPS being temporarily unreachable over
    # SSH) is surfaced as a warning on this job but does NOT fail the overall
    # workflow run, so an infrastructure outage can't red a green build. The
    # deploy is still attempted on every qualifying push and its failure stays
    # visible in the job's logs and status.
    continue-on-error: true
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && vars.DEPLOY_ENABLED == 'true'
    steps:
      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: kovanica-node
          path: bin/

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            # Non-interactive SSH does not source ~/.profile
            export PATH="$HOME/.cargo/bin:$PATH"
            cd /root/kovanica-ledger
            git pull --ff-only origin main
            # Replace binary with CI-built artifact
            cp ~/bin/kovanica-node ./target/release/kovanica-node
            # Restart the seed process pm2 already knows
            command -v pm2 >/dev/null || export PATH="$PATH:/usr/local/bin:/usr/lib/node_modules/.bin"
            pm2 restart kovanica-explorer --update-env
            pm2 save