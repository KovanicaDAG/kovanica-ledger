name: CI & Deploy Kovanica Node

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Build, Test, Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests (unit + integration + doctests)
        run: cargo test

  deploy:
    name: Build & Deploy to VPS
    runs-on: ubuntu-latest
    needs: test
    # Arm by adding the VPS_* secrets AND setting the DEPLOY_ENABLED repo
    # variable to "true" (Settings -> Secrets and variables -> Actions ->
    # Variables). Until then this job is skipped instead of failing.
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && vars.DEPLOY_ENABLED == 'true'
    steps:
      - name: Spajanje na server i deployment
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            cd /root/kovanica-ledger
            git pull --ff-only origin main
            cargo build --release
            # Restart the seed process pm2 already knows (started with the
            # KOVANICA_* env inline); ecosystem.config.js in the repo is a
            # stale template with an unrelated cwd — do not use it here.
            pm2 restart kovanica-explorer --update-env
            pm2 save
